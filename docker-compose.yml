version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fongibility
      SPRING_DATASOURCE_USERNAME: fongibility_user
      SPRING_DATASOURCE_PASSWORD: fongibility_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
    depends_on:
      - postgres
    networks:
      - fongibility-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fongibility-network

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fongibility
      POSTGRES_USER: fongibility_user
      POSTGRES_PASSWORD: fongibility_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fongibility-network

volumes:
  postgres_data:

networks:
  fongibility-network:
    driver: bridge
