spring:
  application:
    name: fongibility-backend

  datasource:
    url: jdbc:h2:mem:fongibilitydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.fongibility: DEBUG

app:
  jwt:
    secret: your-secret-key-change-in-production-very-long-string-for-security
    expiration: 86400000  # 24 hours in milliseconds
