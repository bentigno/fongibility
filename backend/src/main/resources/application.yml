spring:
  application:
    name: fongibility-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:fongibilitydb}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:create-drop}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # La console H2 s'activera uniquement en local si aucune URL PostgreSQL n'est détectée
  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:true}
      path: /h2-console

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.fongibility: DEBUG

app:
  jwt:
    secret: your-secret-key-change-in-production-very-long-string-for-security
    expiration: 86400000  # 24 hours in milliseconds
